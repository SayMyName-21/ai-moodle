# docker-compose.yml

# Compose normally names the project after the folder it sits in, and the volumes
# after the project. The courses, the database and the downloaded models all live
# in volumes named for this one, so it is pinned here: renaming or moving the
# folder would otherwise start a second, empty Moodle alongside the real one.
name: documents

services:
  postgresql:
    image: postgres:16-alpine
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - POSTGRES_USER=moodle
      # Values come from the .env file beside this one, which is not committed.
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=moodle
    volumes:
      - postgresql_data:/var/lib/postgresql/data

  moodle:
    # Built from the Dockerfile beside this file: Moodle 4.5 on PHP 8.3.
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-moodle:4.5-php8.3
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Bound to localhost only, so nothing else on the network can reach Moodle.
    # Drop the 127.0.0.1 prefix only if other machines genuinely need access.
    ports:
      - '127.0.0.1:80:80'
      - '127.0.0.1:443:443'
    environment:
      - MOODLE_DB_TYPE=pgsql
      - MOODLE_DB_HOST=postgresql
      - MOODLE_DB_PORT=5432
      - MOODLE_DB_NAME=moodle
      - MOODLE_DB_USER=moodle
      - MOODLE_DB_PASSWORD=${DB_PASSWORD}
      - MOODLE_URL=http://localhost
      - MOODLE_ADMIN=admin
      - MOODLE_ADMIN_PASSWORD=${MOODLE_ADMIN_PASSWORD}
      - MOODLE_ADMIN_EMAIL=${MOODLE_ADMIN_EMAIL}
      - PHP_UPLOAD_MAX_FILESIZE=256M
      - PHP_POST_MAX_SIZE=256M
      - PHP_MAX_EXECUTION_TIME=300
    volumes:
      - moodle_data:/var/moodledata
      # The Moodle code is in the image. Only the two plugins come from the repo,
      # so editing them here takes effect without rebuilding.
      - ./plugins/local_course_structure:/var/www/html/local/course_structure
      - ./plugins/mod_book:/var/www/html/mod/book
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    depends_on:
      - postgresql

  # Runs Moodle's background tasks, such as reading an uploaded book, which can take
  # far longer than a page can be left loading. Same image and data as moodle, no
  # ports. Only ad hoc tasks run here: Moodle's scheduled maintenance has never been
  # switched on for this site, and doing so is a separate decision.
  cron:
    image: ai-moodle:4.5-php8.3
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: www-data
    entrypoint:
      - sh
      - -c
      - while true; do php /var/www/html/admin/cli/adhoc_task.php --execute --keep-alive=300; sleep 5; done
    environment:
      - MOODLE_DB_HOST=postgresql
      - MOODLE_DB_PORT=5432
      - MOODLE_DB_NAME=moodle
      - MOODLE_DB_USER=moodle
      - MOODLE_DB_PASSWORD=${DB_PASSWORD}
      - MOODLE_URL=http://localhost
    volumes:
      - moodle_data:/var/moodledata
      - ./plugins/local_course_structure:/var/www/html/local/course_structure
      - ./plugins/mod_book:/var/www/html/mod/book
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    depends_on:
      - postgresql
    restart: unless-stopped

  # The only PDF reader: every page of the book is read here, including text that
  # sits inside pictures.
  docling:
    image: quay.io/docling-project/docling-serve
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - '127.0.0.1:5001:5001'
    environment:
      # The image bundles Latin OCR only. Emptying the artifacts path re-enables
      # downloading, so the Cyrillic model is fetched the first time it is wanted
      # and then kept in the volume below.
      - DOCLING_SERVE_ARTIFACTS_PATH=
    volumes:
      # Model weights are a large download, so they outlive the container.
      - docling_models:/opt/app-root/src/.cache
      # Tesseract is the only bundled engine with a Macedonian model, and the
      # image ships English alone, so its language directory is supplied here.
      - ./tessdata:/usr/share/tesseract/tessdata:ro

volumes:
  postgresql_data:
  moodle_data:
  docling_models: